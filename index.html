<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>Seller POS</title>
    <link rel="stylesheet" href="css/style.css" />

    <!-- Firebase -->

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/index.js" defer></script>
    <!-- <script type="module" src="js/indexedDB.js" defer></script> -->
  </head>
  <body>
    <div id="global-loader" style="display: flex">
      <div class="spinner"></div>
    </div>
    <div id="homePage" style="display: none">
      <div class="top-bar">
        <div id="syncStatus" class="status-banner">
          جارٍ التحقق من الاتصال...
        </div>
        <h1 id="title">المبيعات</h1>
        <button id="refreshProductsBtn">🔄 تحديث المنتجات</button>
        <button id="logout">تسجيل الخروج</button>
        <p id="userName"/ >
      </div>

      <!-- Search -->
      <input type="text" id="searchInput" placeholder="البحث ..." />

      <!-- Tags -->
      <div id="Category" class="tag-container"></div>
      <div id="tagFilters" class="tag-container"></div>

      <div id="category-tags" class="filter-tags"></div>
      <div id="tag-tags" class="filter-tags"></div>

      <!-- Main Container -->
      <div class="container">
        <!-- Product List -->
        <div class="left-column">
          <h2>المنتجات</h2>
          <div id="productList"></div>
        </div>

        <!-- Cart -->
        <div class="right-column">
          <h2>العربة</h2>
          <div>
            <input type="checkbox" id="isQuantityOrdered" /> <label for="isQuantityOrdered">عميل جملة</label>
            <br />
            <input type="checkbox" id="allowSkipCustomer" /> <label for="allowSkipCustomer">تخطي اختيار العميل</label>
          </div>
          <div class="customer-search">
            <input type="text" id="customerSearchInput" placeholder="ابحث عن عميل بالاسم أو الهاتف" />
            <button id="toggleCustomerFormBtn" type="button">إضافة عميل جديد</button>
          </div>
          <div>
            <select id="customerSelect">
              <option value="">اختر العميل</option>
            </select>
          </div>
          <div id="newCustomerForm" style="display: none; margin-top: 10px;">
            <input type="text" id="newCustomerName" placeholder="الاسم" />
            <input type="text" id="newCustomerAddress" placeholder="العنوان" />
            <input type="text" id="newCustomerMobile" placeholder="الهاتف" />
            <button id="addCustomerBtn" type="button">حفظ العميل</button>
          </div>
          <ul id="cartList"></ul>
          <h3>الاجمالي: <span id="totalPrice">0.00</span> جنيه</h3>
          <button id="submitOrder">ازسال</button>
          <button id="submitReturn">إرجاع الأصناف</button>

          <div id="offlineSalesBox" style="display: none">
            <h3>⏳ المبيعات غير المرسلة</h3>
            <ul id="unsyncedSalesList"></ul>
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <!-- <script src="js/firebase-config.js"></script> -->
    <!-- <script src="js/indexedDB.js"></script> -->
    <!-- <script src="js/index.js"></script> -->
  </body>
</html>
